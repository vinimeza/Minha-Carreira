<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Minha Carreira</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1220;
  color:#f8fafc;
}

.app{
  max-width:700px;
  margin:auto;
  padding:24px 18px 40px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.small{
  color:#94a3b8;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
}

h1{
  margin:5px 0;
  font-size:34px;
}

.subtitle{
  color:#94a3b8;
}

.boot{
  font-size:48px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.card{
  background:#172033;
  border:1px solid #26334a;
  border-radius:18px;
  padding:18px;
}

.label{
  color:#94a3b8;
  font-size:11px;
  text-transform:uppercase;
}

.number{
  font-size:30px;
  font-weight:800;
  margin-top:5px;
}

h2{
  font-size:18px;
  margin:0 0 15px;
}

.form{
  display:grid;
  gap:13px;
}

label{
  display:block;
  color:#94a3b8;
  font-size:13px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  height:48px;
  border-radius:12px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
  padding:0 12px;
  font-size:16px;
}

button{
  width:100%;
  height:50px;
  border:0;
  border-radius:12px;
  background:#f8fafc;
  color:#0b1220;
  font-weight:800;
  font-size:16px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.cat{
  text-align:center;
}

.cat strong{
  display:block;
  font-size:21px;
  margin-top:5px;
}

.pelada{border-top:3px solid #22c55e}
.amistoso{border-top:3px solid #3b82f6}
.campeonato{border-top:3px solid #ef4444}

.progress{
  height:10px;
  background:#0f172a;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.bar{
  height:100%;
  width:0%;
  background:#f8fafc;
  transition:.3s;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  color:#cbd5e1;
  font-size:13px;
}

.history{
  display:grid;
  gap:8px;
}

.game{
  display:grid;
  grid-template-columns:85px 1fr 50px;
  align-items:center;
  gap:10px;
  background:#172033;
  border:1px solid #26334a;
  border-radius:12px;
  padding:13px;
}

.date{
  color:#94a3b8;
  font-size:13px;
}

.type{
  display:inline-block;
  background:#26334a;
  border-radius:20px;
  padding:5px 9px;
  font-size:11px;
}

.goals{
  text-align:right;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#94a3b8;
  padding:25px;
  border:1px dashed #334155;
  border-radius:14px;
}

.section{
  margin-top:20px;
}

@media(max-width:500px){
  .stats,.categories{
    grid-template-columns:1fr;
  }

  h1{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="small">Minha temporada</div>
      <h1>Minha Carreira</h1>
      <div class="subtitle">Minha história com essa chuteira 👟</div>
    </div>
    <div class="boot">👟</div>
  </div>

  <div class="stats">
    <div class="card">
      <div class="label">Gols</div>
      <div class="number" id="totalGoals">0</div>
    </div>

    <div class="card">
      <div class="label">Jogos</div>
      <div class="number" id="totalGames">0</div>
    </div>

    <div class="card">
      <div class="label">Média</div>
      <div class="number" id="average">0,00</div>
    </div>
  </div>

  <div class="card">
    <h2>⚽ Registrar jogo</h2>

    <form id="form" class="form">

      <div>
        <label>Data</label>
        <input type="date" id="date" required>
      </div>

      <div>
        <label>Tipo de partida</label>
        <select id="type">
          <option value="Pelada">🟢 Pelada</option>
          <option value="Amistoso">🔵 Amistoso</option>
          <option value="Campeonato">🔴 Campeonato</option>
        </select>
      </div>

      <div>
        <label>Quantos gols você fez?</label>
        <input type="number" id="goals" min="0" max="99" value="0" required>
      </div>

      <button type="submit">+ REGISTRAR JOGO</button>

    </form>
  </div>

  <div class="section">
    <h2>📊 Por categoria</h2>

    <div class="categories">

      <div class="card cat pelada">
        <div class="label">Peladas</div>
        <strong id="pelada">0</strong>
      </div>

      <div class="card cat amistoso">
        <div class="label">Amistosos</div>
        <strong id="amistoso">0</strong>
      </div>

      <div class="card cat campeonato">
        <div class="label">Campeonatos</div>
        <strong id="campeonato">0</strong>
      </div>

    </div>
  </div>

  <div class="section card">
    <h2>🏆 Meta: 100 gols</h2>

    <div class="progress-info">
      <span id="progressText">0 de 100</span>
      <span id="remaining">Faltam 100</span>
    </div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>
  </div>

  <div class="section">
    <h2>📅 Histórico</h2>

    <div id="history" class="history">
      <div class="empty">
        Ainda não há jogos registrados.<br>
        O primeiro gol começa a carreira. ⚽
      </div>
    </div>
  </div>

</div>

<script>

let games = [];

try{
  games = JSON.parse(localStorage.getItem("minha-carreira-jogos") || "[]");

  if(!Array.isArray(games)){
    games=[];
  }
}catch(e){
  games=[];
}

const dateInput = document.getElementById("date");

const today = new Date();

dateInput.value =
  today.getFullYear() + "-" +
  String(today.getMonth()+1).padStart(2,"0") + "-" +
  String(today.getDate()).padStart(2,"0");


function save(){

  localStorage.setItem(
    "minha-carreira-jogos",
    JSON.stringify(games)
  );

}


function render(){

  const totalGoals =
    games.reduce((total,game)=>total + game.goals,0);

  const totalGames = games.length;

  const average =
    totalGames ? totalGoals / totalGames : 0;

  document.getElementById("totalGoals").textContent =
    totalGoals;

  document.getElementById("totalGames").textContent =
    totalGames;

  document.getElementById("average").textContent =
    average.toFixed(2).replace(".",",");


  ["Pelada","Amistoso","Campeonato"].forEach(type=>{

    const total =
      games
      .filter(game=>game.type===type)
      .reduce((sum,game)=>sum+game.goals,0);

    document.getElementById(type.toLowerCase()).textContent =
      total + (total===1 ? " gol" : " gols");

  });


  const percentage =
    Math.min(totalGoals,100);

  document.getElementById("bar").style.width =
    percentage + "%";

  document.getElementById("progressText").textContent =
    totalGoals + " de 100";

  document.getElementById("remaining").textContent =
    totalGoals >= 100
      ? "META ALCANÇADA! 🎉"
      : "Faltam " + (100-totalGoals);


  const history =
    document.getElementById("history");


  if(!games.length){

    history.innerHTML =
      '<div class="empty">Ainda não há jogos registrados.<br>O primeiro gol começa a carreira. ⚽</div>';

    return;

  }


  history.innerHTML =
    games
    .slice()
    .reverse()
    .map(game=>{

      const date =
        game.date.split("-").reverse().join("/");

      return `
        <div class="game">

          <div class="date">
            ${date}
          </div>

          <div>
            <span class="type">
              ${game.type}
            </span>
          </div>

          <div class="goals">
            ⚽ ${game.goals}
          </div>

        </div>
      `;

    })
    .join("");

}


document.getElementById("form")
.addEventListener("submit",function(event){

  event.preventDefault();


  const goals =
    Math.max(
      0,
      Math.min(
        99,
        parseInt(
          document.getElementById("goals").value
        ) || 0
      )
    );


  games.push({

    date:
      document.getElementById("date").value,

    type:
      document.getElementById("type").value,

    goals:goals

  });


  games.sort(
    (a,b)=>a.date.localeCompare(b.date)
  );


  save();


  document.getElementById("goals").value = 0;


  render();

});


render();

</script>

</body>
</html>
